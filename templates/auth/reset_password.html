{% extends "base.html" %}
{% block title %}Reset Password - HireLens{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">

        <div class="auth-brand">
            <a href="{{ url_for('main.index') }}" class="brand-logo" style="justify-content: center;">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <circle cx="11" cy="14" r="3"/>
                        <line x1="13.5" y1="16.5" x2="16.5" y2="19.5"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">Hire<span class="brand-highlight">Lens</span></span>
                </div>
            </a>
        </div>

        <div class="card auth-card">
            <div class="auth-card-header">
                <h1 class="auth-title">Set new password</h1>
                <p class="auth-subtitle">Choose a strong password for your HireLens account.</p>
            </div>

            <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST" class="auth-form" id="reset-form">

                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <div class="input-with-toggle">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="At least 8 characters"
                            required
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <button type="button" class="input-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <div class="input-with-toggle">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-input"
                            placeholder="Repeat your new password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="input-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)" aria-label="Toggle confirm password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit-btn">
                    <span>Update Password</span>
                </button>
            </form>

            <div class="auth-footer-links" style="margin-top: 1.5rem;">
                <p><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('reset-form').addEventListener('submit', function(e) {
    const p = document.getElementById('password').value;
    const c = document.getElementById('confirm_password').value;
    if (p !== c) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
    }
});
</script>
{% endblock %}
